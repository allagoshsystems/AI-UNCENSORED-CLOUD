name: Run llama.cpp + Gradio + Cloudflare Tunnel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-model:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MODEL_REPO: HauhauCS/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive
      MODEL_DIR: ${{ github.workspace }}/models
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libcurl4-openssl-dev

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            llama-cpp-python \
            gradio \
            huggingface_hub \
            hf_transfer

      - name: Install Cloudflare Tunnel
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --output /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Validate required secrets
        shell: bash
        run: |
          set -euxo pipefail
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "::error::HF_TOKEN secret is missing or empty."
            exit 1
          fi
          if [[ -z "${LLAMA_API_KEY:-}" ]]; then
            echo "::error::LLAMA_API_KEY secret is missing or empty."
            exit 1
          fi

      - name: Download GGUF model from Hugging Face
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$MODEL_DIR"

          python - <<'PY'
          import os
          from huggingface_hub import HfApi, hf_hub_download

          repo = os.environ["MODEL_REPO"]
          token = os.environ.get("HF_TOKEN")
          local_dir = os.environ["MODEL_DIR"]

          api = HfApi()
          files = api.list_repo_files(repo_id=repo, repo_type="model", token=token)
          gguf_files = [f for f in files if f.lower().endswith(".gguf")]

          if not gguf_files:
              raise RuntimeError(f"No .gguf files found in {repo}")

          preferred = [f for f in gguf_files if any(k in f.lower() for k in ("f16", "fp16", "q4", "q5", "q8"))]
          chosen = preferred[0] if preferred else gguf_files[0]

          downloaded = hf_hub_download(
              repo_id=repo,
              filename=chosen,
              repo_type="model",
              token=token,
              local_dir=local_dir,
          )

          print(f"Downloaded model: {downloaded}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"MODEL_PATH={downloaded}\n")
          PY

          echo "Downloaded files:"
          ls -lh "$MODEL_DIR"

      - name: Build llama.cpp server
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release --target llama-server -j "$(nproc)"

      - name: Start Gradio app
        shell: bash
        run: |
          set -euxo pipefail

          if [[ -z "${MODEL_PATH:-}" ]]; then
            echo "::error::MODEL_PATH is empty after download."
            exit 1
          fi

          echo "Using model at: $MODEL_PATH"

          nohup python app.py > app.log 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> "$GITHUB_ENV"

          sleep 5

          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:7860 >/dev/null; then
              echo "Gradio is responding on 127.0.0.1:7860"
              break
            fi
            echo "Waiting for Gradio to start... attempt $i/120"
            sleep 2
          done

          curl -fsS http://127.0.0.1:7860 >/dev/null || {
            echo "::error::Gradio failed to start"
            tail -n 200 app.log || true
            exit 1
          }

      - name: Start llama.cpp server
        shell: bash
        run: |
          set -euxo pipefail
          SERVER_BIN="$RUNNER_TEMP/llama.cpp/build/bin/llama-server"

          if [[ ! -x "$SERVER_BIN" ]]; then
            echo "::error::llama-server binary not found at $SERVER_BIN"
            exit 1
          fi

          nohup "$SERVER_BIN" \
            -hf "$MODEL_REPO" \
            --host 0.0.0.0 \
            --port 8080 \
            --api-key "$LLAMA_API_KEY" \
            > llama-server.log 2>&1 &

          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"

          sleep 10

          for i in $(seq 1 180); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::llama-server exited while starting"
              tail -n 200 llama-server.log || true
              exit 1
            fi

            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              echo "llama.cpp server is healthy on port 8080"
              break
            fi

            echo "Waiting for llama.cpp model startup... attempt $i/180"
            sleep 5
          done

          curl -fsS http://127.0.0.1:8080/health >/dev/null || {
            echo "::error::llama.cpp server did not become healthy"
            tail -n 200 llama-server.log || true
            exit 1
          }

      - name: Start Cloudflare Tunnel
        shell: bash
        run: |
          set -euxo pipefail

          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 --loglevel info > cloudflared.log 2>&1 &
          TUNNEL_PID=$!
          echo "TUNNEL_PID=$TUNNEL_PID" >>


name: Run LLM with Cloudflare Tunnel

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-model:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MODEL_REPO: HauhauCS/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive
      MODEL_DIR: ${{ github.workspace }}/models
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            llama-cpp-python \
            gradio \
            huggingface_hub \
            hf_transfer

      - name: Install Cloudflare Tunnel
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --output /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Validate Hugging Face token
        shell: bash
        run: |
          set -euxo pipefail
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "::error::HF_TOKEN secret is missing or empty. Add your Hugging Face token to repository secrets."
            exit 1
          fi

      - name: Download model from Hugging Face
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$MODEL_DIR"

          python - <<'PY'
          import os
          from huggingface_hub import HfApi, hf_hub_download

          repo = os.environ["MODEL_REPO"]
          token = os.environ.get("HF_TOKEN")
          local_dir = os.environ["MODEL_DIR"]

          if not token:
              raise RuntimeError("HF_TOKEN is empty. Add the secret and rerun.")

          api = HfApi()
          files = api.list_repo_files(repo_id=repo, repo_type="model", token=token)
          gguf_files = [f for f in files if f.lower().endswith(".gguf")]

          if not gguf_files:
              raise RuntimeError(f"No .gguf files found in {repo}")

          preferred = [
              f for f in gguf_files
              if any(k in f.lower() for k in ("f16", "fp16", "q4", "q5", "q8"))
          ]
          chosen = preferred[0] if preferred else gguf_files[0]

          downloaded = hf_hub_download(
              repo_id=repo,
              filename=chosen,
              repo_type="model",
              token=token,
              local_dir=local_dir,
          )

          print(f"Downloaded model: {downloaded}")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as env_file:
                  env_file.write(f"MODEL_PATH={downloaded}\n")
          else:
              raise RuntimeError("GITHUB_ENV is not defined")
          PY

          echo "MODEL_PATH is set"
          ls -lh "$MODEL_DIR"

      - name: Start Gradio app
        shell: bash
        run: |
          set -euxo pipefail

          if [[ -z "${MODEL_PATH:-}" ]]; then
            echo "::error::MODEL_PATH is empty after model download."
            exit 1
          fi

          echo "Using model at: $MODEL_PATH"

          nohup python app.py > app.log 2>&1 &
          sleep 5

          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:7860 >/dev/null; then
              echo "Gradio is responding on 127.0.0.1:7860"
              break
            fi
            echo "Waiting for Gradio to start... attempt $i/120"
            sleep 2
          done

          curl -fsS http://127.0.0.1:7860 >/dev/null || {
            echo "::error::Gradio failed to start"
            tail -n 200 app.log || true
            exit 1
          }

      - name: Start Cloudflare Tunnel
        shell: bash
        run: |
          set -euxo pipefail

          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:7860 --loglevel info > cloudflared.log 2>&1 &
          sleep 10

          for i in $(seq 1 120); do
            url=$(grep -Eo 'https://[^[:space:]]+trycloudflare.com|https://[^[:space:]]+cloudflareaccess.com' cloudflared.log | tail -n 1 || true)
            if [[ -n "$url" ]]; then
              echo "Cloudflare tunnel URL: $url"
              break
            fi
            echo "Waiting for Cloudflare URL... attempt $i/120"
            sleep 2
          done

          url=$(grep -Eo 'https://[^[:space:]]+trycloudflare.com|https://[^[:space:]]+cloudflareaccess.com' cloudflared.log | tail -n 1 || true)
          if [[ -z "$url" ]]; then
            echo "::error::Cloudflare tunnel did not start correctly"
            tail -n 300 cloudflared.log || true
            exit 1
          fi

          echo "Tunnel ready: $url"
          tail -n 50 cloudflared.log

      - name: Keep Run Alive for 6 Hours
        shell: bash
        timeout-minutes: 360
        run: |
          set -euxo pipefail
          echo "Workflow is running. The tunnel will stay active until the job ends."
          sleep 21600

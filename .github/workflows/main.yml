name: Run LLM with Cloudflare Tunnel

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  run-model:
  runs-on: ubuntu-latest
  timeout-minutes: 360 # Max allowed time (6 hours)

  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python gradio

    - name: Install Cloudflare Tunnel (cloudflared)
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        cloudflared --version

    - name: Start Application and Cloudflare Tunnel
      run: |
        # Run your python app in the background (make sure your script binds to port 7860)
        python app.py &
        
        # Wait a moment for the server to spin up, then start the cloudflare tunnel
        sleep 10
        cloudflared tunnel --url http://localhost:7860

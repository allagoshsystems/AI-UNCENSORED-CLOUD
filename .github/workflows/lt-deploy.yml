name: Run LTX-2.5 ComfyUI on GitHub Actions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ltx-2-5-comfyui-public-server
  cancel-in-progress: true

jobs:
  serve:
    name: Prepare LTX-2.5 and open Cloudflare Quick Tunnel
    # Requires a GitHub-managed GPU larger runner. Standard ubuntu-latest has no GPU.
    runs-on:
      group: ${{ vars.LTX_RUNNER_GROUP }}
      labels: ${{ vars.LTX_RUNNER_LABEL }}
    timeout-minutes: 350

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      COMFY_PORT: "8188"
      COMFY_DIR: ${{ github.workspace }}/ComfyUI
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check GPU, RAM, and disk capacity
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "::error::No NVIDIA GPU found. Standard ubuntu-latest runners cannot run LTX-2.5."
            exit 1
          fi
          nvidia-smi
          GPU_NAME="$(nvidia-smi --query-gpu=name --format=csv,noheader | head -n 1)"
          GPU_VRAM_MB="$(nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits | head -n 1 | tr -d ' ')"
          RAM_GB="$(awk '/MemTotal/ {printf "%d", $2/1024/1024}' /proc/meminfo)"
          DISK_GB="$(df -BG --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -dc '0-9')"
          echo "GPU: ${GPU_NAME} (${GPU_VRAM_MB} MiB VRAM)"
          echo "System RAM: ${RAM_GB} GiB"
          echo "Free workspace disk: ${DISK_GB} GiB"
          if [[ "$GPU_VRAM_MB" -lt 15000 ]]; then
            echo "::error::This experimental setup requires about 16GB GPU VRAM."
            exit 1
          fi
          if [[ "$RAM_GB" -lt 24 ]]; then
            echo "::error::At least 24 GiB system RAM is required for this low-VRAM attempt."
            exit 1
          fi
          if [[ "$DISK_GB" -lt 100 ]]; then
            echo "::error::At least 100 GiB free disk space is required."
            exit 1
          fi
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo "::error::Add HF_TOKEN as a repository Actions secret and accept LTX-2.5's Hugging Face model terms."
            exit 1
          fi

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git curl ca-certificates ffmpeg pkg-config
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install CUDA-enabled PyTorch and ComfyUI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
          git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git "$COMFY_DIR"
          python -m pip install -r "$COMFY_DIR/requirements.txt"
          mkdir -p "$COMFY_DIR/custom_nodes"
          git clone --depth 1 https://github.com/Lightricks/ComfyUI-LTXVideo.git \
            "$COMFY_DIR/custom_nodes/ComfyUI-LTXVideo"
          python -m pip install -r "$COMFY_DIR/custom_nodes/ComfyUI-LTXVideo/requirements.txt"
          python - <<'PY'
          import torch
          print("PyTorch:", torch.__version__)
          print("CUDA available:", torch.cuda.is_available())
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is not available to PyTorch on this runner.")
          print("GPU:", torch.cuda.get_device_name(0))
          print("VRAM GiB:", round(torch.cuda.get_device_properties(0).total_memory / 1024**3, 2))
          PY

      - name: Install Hugging Face download tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade huggingface_hub hf_transfer
          hf --help >/dev/null

      - name: Download official LTX-2.5 lower-VRAM model components
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$COMFY_DIR/models/diffusion_models" \
            "$COMFY_DIR/models/text_encoders" "$COMFY_DIR/models/vae" \
            "$COMFY_DIR/models/latent_upscale_models" "$COMFY_DIR/models/model_patches"

          # Lightricks' lower-VRAM INT8 ConvRot transformer and matching text encoder.
          hf download Lightricks/LTX-2.5 \
            diffusion_models/ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors \
            --local-dir "$COMFY_DIR/models"
          hf download Lightricks/LTX-2.5 \
            text_encoders/gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors \
            --local-dir "$COMFY_DIR/models"

          # Lighter convolutional video VAE and audio VAE.
          hf download Lightricks/LTX-2.5 \
            vae/ltx-2.5-video-vae-conv-bf16.safetensors \
            vae/ltx-2.5-audio-vae-bf16.safetensors \
            --local-dir "$COMFY_DIR/models"

          # Supporting components for the official LTX-2.5 templates.
          hf download Lightricks/LTX-2.5 \
            latent_upscale_models/ltx-2.5-latent-spatial-upscaler-x2-bf16-1.0.safetensors \
            model_patches/ltx-2.5-duration-head-bf16.safetensors \
            --local-dir "$COMFY_DIR/models"

          # Optional prompt enhancer used by the standard templates.
          hf download Comfy-Org/gemma-4 gemma4_e2b_it_bf16.safetensors \
            --local-dir "$COMFY_DIR/models/text_encoders"

          echo "Downloaded model components:"
          find "$COMFY_DIR/models" -type f -printf '%p %k KB\n' | sort
          df -h "$GITHUB_WORKSPACE"

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            --output /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Start ComfyUI, check health, and start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          cd "$COMFY_DIR"
          nohup python main.py \
            --listen 127.0.0.1 \
            --port "$COMFY_PORT" \
            --force-fp16 \
            --lowvram \
            --cpu-vae \
            --disable-auto-launch \
            > "$GITHUB_WORKSPACE/logs/comfyui.log" 2>&1 &
          COMFY_PID=$!
          echo "$COMFY_PID" > "$GITHUB_WORKSPACE/logs/comfyui.pid"

          echo "Waiting for ComfyUI..."
          for attempt in $(seq 1 180); do
            if curl --silent --fail "http://127.0.0.1:${COMFY_PORT}/system_stats" >/dev/null; then
              echo "ComfyUI is responding."
              break
            fi
            if ! kill -0 "$COMFY_PID" 2>/dev/null; then
              echo "::error::ComfyUI exited before becoming ready."
              tail -n 160 "$GITHUB_WORKSPACE/logs/comfyui.log" || true
              exit 1
            fi
            if [[ "$attempt" -eq 180 ]]; then
              echo "::error::ComfyUI did not become ready within 15 minutes."
              tail -n 160 "$GITHUB_WORKSPACE/logs/comfyui.log" || true
              exit 1
            fi
            sleep 5
          done

          cloudflared tunnel --no-autoupdate \
            --url "http://127.0.0.1:${COMFY_PORT}" \
            > "$GITHUB_WORKSPACE/logs/cloudflared.log" 2>&1 &
          TUNNEL_PID=$!
          echo "$TUNNEL_PID" > "$GITHUB_WORKSPACE/logs/cloudflared.pid"

          PUBLIC_URL=""
          for attempt in $(seq 1 60); do
            PUBLIC_URL="$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              "$GITHUB_WORKSPACE/logs/cloudflared.log" | head -n 1 || true)"
            if [[ -n "$PUBLIC_URL" ]]; then break; fi
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "::error::Cloudflare Quick Tunnel exited."
              cat "$GITHUB_WORKSPACE/logs/cloudflared.log" || true
              exit 1
            fi
            sleep 2
          done
          if [[ -z "$PUBLIC_URL" ]]; then
            echo "::error::Could not obtain the Cloudflare Quick Tunnel URL."
            cat "$GITHUB_WORKSPACE/logs/cloudflared.log" || true
            exit 1
          fi

          {
            echo "## LTX-2.5 ComfyUI is running"
            echo
            echo "**ComfyUI URL:** ${PUBLIC_URL}"
            echo
            echo "Open the Templates panel and choose an LTX-2.5 Text-to-Video or Image-to-Video template."
            echo
            echo "Experimental low-VRAM configuration: generation may still fail on a 16GB T4."
            echo
            echo "The Quick Tunnel URL is accessible to anyone who obtains it. Keep it private and cancel this workflow when finished."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=LTX-2.5 ComfyUI URL::${PUBLIC_URL}"
          echo "ComfyUI is live. Keep this workflow running while using the UI."

          while kill -0 "$COMFY_PID" 2>/dev/null && kill -0 "$TUNNEL_PID" 2>/dev/null; do
            sleep 20
          done
          echo "::error::ComfyUI or Cloudflare tunnel stopped unexpectedly."
          tail -n 160 "$GITHUB_WORKSPACE/logs/comfyui.log" || true
          tail -n 100 "$GITHUB_WORKSPACE/logs/cloudflared.log" || true
          exit 1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltx-2-5-comfyui-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 3

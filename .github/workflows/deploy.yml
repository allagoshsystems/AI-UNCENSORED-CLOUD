
name: Run GPT-oss 20B GGUF on GitHub Actions

on:
  workflow_dispatch:
    inputs:
      context_size:
        description: "Context size (model recommends minimum 8192)"
        required: true
        default: "8192"
      quantization:
        description: "GGUF quantization"
        required: true
        type: choice
        options:
          - IQ4_NL
        default: IQ4_NL

permissions:
  contents: read

concurrency:
  group: gpt-oss-20b-public-server
  cancel-in-progress: true

jobs:
  serve:
    name: Build, load GPT-oss 20B, then open Cloudflare Quick Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MODEL_REPO: DavidAU/OpenAi-GPT-oss-20b-HERETIC-uncensored-NEO-Imatrix-gguf
      MODEL_FILE: OpenAI-20B-NEO-CODEPlus-Uncensored-IQ4_NL.gguf
      MODEL_PATH: ${{ github.workspace }}/models/model.gguf
      LLAMA_PORT: "8080"
      LLAMA_CTX_SIZE: ${{ inputs.context_size }}
      LLAMA_THREADS: "4"
      LLAMA_BATCH_SIZE: "128"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner resources
        shell: bash
        run: |
          set -e
          echo "CPU:"
          nproc
          echo "Memory:"
          free -h
          echo "Disk:"
          df -h /

      - name: Install build and runtime dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git libcurl4-openssl-dev \
            pkg-config curl ca-certificates
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build llama.cpp server
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_CURL=ON
          cmake --build llama.cpp/build \
            --config Release \
            --target llama-server \
            -j2
          test -x llama.cpp/build/bin/llama-server
          llama.cpp/build/bin/llama-server --version

      - name: Download GPT-oss 20B GGUF from Hugging Face
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models

          URL="https://huggingface.co/${MODEL_REPO}/resolve/main/${MODEL_FILE}?download=true"

          echo "Downloading: ${MODEL_FILE}"

          if [[ -n "${HF_TOKEN:-}" ]]; then
            curl --fail --location --retry 5 --retry-all-errors \
              --header "Authorization: Bearer ${HF_TOKEN}" \
              "$URL" --output "$MODEL_PATH"
          else
            curl --fail --location --retry 5 --retry-all-errors \
              "$URL" --output "$MODEL_PATH"
          fi

          test -s "$MODEL_PATH"

          echo "Downloaded model:"
          ls -lh "$MODEL_PATH"
          echo "Disk after download:"
          df -h /

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            --output /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Start GPT-oss 20B, verify health, then start free Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs

          # Start the model server first.
          nohup ./llama.cpp/build/bin/llama-server \
            --model "$MODEL_PATH" \
            --host 127.0.0.1 \
            --port "$LLAMA_PORT" \
            --ctx-size "$LLAMA_CTX_SIZE" \
            --threads "$LLAMA_THREADS" \
            --batch-size "$LLAMA_BATCH_SIZE" \
            --parallel 1 \
            --jinja \
            --temp 0.6 \
            --top-p 0.95 \
            --top-k 40 \
            --min-p 0.05 \
            --repeat-penalty 1.1 \
            > logs/llama-server.log 2>&1 &

          MODEL_PID=$!
          echo "$MODEL_PID" > logs/llama-server.pid

          echo "Waiting for GPT-oss health check..."

          for attempt in $(seq 1 180); do
            if curl --silent --fail \
              "http://127.0.0.1:${LLAMA_PORT}/health" >/dev/null; then
              echo "GPT-oss is healthy."
              break
            fi

            if ! kill -0 "$MODEL_PID" 2>/dev/null; then
              echo "::error::llama-server exited before becoming healthy."
              tail -n 150 logs/llama-server.log || true
              exit 1
            fi

            if [[ "$attempt" -eq 180 ]]; then
              echo "::error::Model did not become healthy within 15 minutes."
              tail -n 150 logs/llama-server.log || true
              exit 1
            fi

            sleep 5
          done

          # Start free Cloudflare Quick Tunnel.
          cloudflared tunnel --no-autoupdate \
            --url "http://127.0.0.1:${LLAMA_PORT}" \
            > logs/cloudflared.log 2>&1 &

          TUNNEL_PID=$!
          echo "$TUNNEL_PID" > logs/cloudflared.pid

          echo "Waiting for public URL..."

          PUBLIC_URL=""

          for attempt in $(seq 1 60); do
            PUBLIC_URL="$(grep -Eo \
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              logs/cloudflared.log | head -n 1 || true)"

            if [[ -n "$PUBLIC_URL" ]]; then
              break
            fi

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "::error::Cloudflare Quick Tunnel exited."
              cat logs/cloudflared.log || true
              exit 1
            fi

            sleep 2
          done

          if [[ -z "$PUBLIC_URL" ]]; then
            echo "::error::Could not obtain the Quick Tunnel URL."
            cat logs/cloudflared.log || true
            exit 1
          fi

          {
            echo "## GPT-oss 20B is ready"
            echo
            echo "**Public chat URL:** $PUBLIC_URL"
            echo
            echo "Temporary URL works while this GitHub Actions job is running."
            echo "Protect this URL; anyone who obtains it may access the model."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=GPT-oss 20B public URL::$PUBLIC_URL"
          echo "GPT-oss is running. Keeping the workflow alive..."

          wait "$TUNNEL_PID"

      - name: Upload service logs if the job fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-oss-20b-server-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 3

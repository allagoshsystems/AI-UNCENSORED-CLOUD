name: Run Gemma 4 GGUF on GitHub Actions

on:
  workflow_dispatch:
    inputs:
      context_size:
        description: "Context size (start with 4096 on a standard runner)"
        required: true
        default: "4096"
      quantization:
        description: "GGUF quantization"
        required: true
        type: choice
        options:
          - Q4_K_M
          - IQ4_XS
          - Q3_K_M
        default: Q4_K_M

permissions:
  contents: read

# A new run replaces the previous run for this repository.
concurrency:
  group: gemma4-public-server
  cancel-in-progress: true

jobs:
  serve:
    name: Build, load Gemma 4, then open Cloudflare Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      MODEL_REPO: HauhauCS/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive
      MODEL_PREFIX: Gemma-4-E4B-Uncensored-HauhauCS-Aggressive
      MODEL_PATH: ${{ github.workspace }}/models/model.gguf
      LLAMA_PORT: "8080"
      LLAMA_CTX_SIZE: ${{ inputs.context_size }}
      LLAMA_THREADS: "4"
      LLAMA_BATCH_SIZE: "128"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner resources
        shell: bash
        run: |
          set -e
          echo "CPU:"
          nproc
          echo "Memory:"
          free -h
          echo "Disk:"
          df -h /

      - name: Install build and runtime dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git libcurl4-openssl-dev \
            pkg-config curl ca-certificates
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build llama.cpp server
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_CURL=ON
          cmake --build llama.cpp/build \
            --config Release \
            --target llama-server \
            -j2
          test -x llama.cpp/build/bin/llama-server
          llama.cpp/build/bin/llama-server --version

      - name: Download selected GGUF from Hugging Face
        shell: bash
        env:
          QUANT: ${{ inputs.quantization }}
        run: |
          set -euo pipefail
          mkdir -p models
          FILE="${MODEL_PREFIX}-${QUANT}.gguf"
          URL="https://huggingface.co/${MODEL_REPO}/resolve/main/${FILE}?download=true"

          if [[ -n "${HF_TOKEN:-}" ]]; then
            curl --fail --location --retry 5 --retry-all-errors \
              --header "Authorization: Bearer ${HF_TOKEN}" \
              "$URL" --output "$MODEL_PATH"
          else
            curl --fail --location --retry 5 --retry-all-errors \
              "$URL" --output "$MODEL_PATH"
          fi

          test -s "$MODEL_PATH"
          echo "Downloaded:"
          ls -lh "$MODEL_PATH"
          df -h /

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            --output /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Start model, verify health, then start free Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs

          # Start llama.cpp first; expose it only after its health check passes.
          nohup ./llama.cpp/build/bin/llama-server \
            --model "$MODEL_PATH" \
            --host 127.0.0.1 \
            --port "$LLAMA_PORT" \
            --ctx-size "$LLAMA_CTX_SIZE" \
            --threads "$LLAMA_THREADS" \
            --batch-size "$LLAMA_BATCH_SIZE" \
            --jinja \
            --temp 1.0 \
            --top-p 0.95 \
            --top-k 64 \
            > logs/llama-server.log 2>&1 &
          MODEL_PID=$!
          echo "$MODEL_PID" > logs/llama-server.pid

          echo "Waiting for llama.cpp health check..."
          for attempt in $(seq 1 180); do
            if curl --silent --fail "http://127.0.0.1:${LLAMA_PORT}/health" >/dev/null; then
              echo "llama.cpp is healthy."
              break
            fi
            if ! kill -0 "$MODEL_PID" 2>/dev/null; then
              echo "::error::llama-server exited before becoming healthy."
              tail -n 100 logs/llama-server.log || true
              exit 1
            fi
            if [[ "$attempt" -eq 180 ]]; then
              echo "::error::llama-server did not become healthy within 15 minutes."
              tail -n 100 logs/llama-server.log || true
              exit 1
            fi
            sleep 5
          done

          # Cloudflare Quick Tunnel gives a temporary *.trycloudflare.com URL.
          # It needs no purchased domain and no tunnel-token secret.
          cloudflared tunnel --no-autoupdate --url "http://127.0.0.1:${LLAMA_PORT}" \
            > logs/cloudflared.log 2>&1 &
          TUNNEL_PID=$!
          echo "$TUNNEL_PID" > logs/cloudflared.pid

          echo "Waiting for the public Quick Tunnel URL..."
          PUBLIC_URL=""
          for attempt in $(seq 1 60); do
            PUBLIC_URL="$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' logs/cloudflared.log | head -n 1 || true)"
            if [[ -n "$PUBLIC_URL" ]]; then
              break
            fi
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "::error::cloudflared exited before creating a Quick Tunnel."
              cat logs/cloudflared.log || true
              exit 1
            fi
            sleep 2
          done

          if [[ -z "$PUBLIC_URL" ]]; then
            echo "::error::Could not find the Quick Tunnel URL in cloudflared output."
            cat logs/cloudflared.log || true
            exit 1
          fi

          {
            echo "## Gemma 4 is ready"
            echo
            echo "**Public chat URL:** $PUBLIC_URL"
            echo
            echo "This temporary URL works only while this GitHub Actions job is running."
            echo "Anyone with the URL may be able to access the model; do not share it publicly."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Gemma 4 public URL::$PUBLIC_URL"
          echo "Quick Tunnel is running. Keeping the GitHub Actions job alive..."
          wait "$TUNNEL_PID"

      - name: Upload service logs if the job fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-server-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 3
